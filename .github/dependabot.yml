version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Types must match the runtime major (Node 22, see .nvmrc). Bump this
      # together with .nvmrc and engines when the runtime moves. jsdom/undici
      # bumps can raise the engines floor: check their engines.node too.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
