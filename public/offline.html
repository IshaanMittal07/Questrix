<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070A12" />
    <title>Offline · Questrix</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070a12;
        color: #e8eeff;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        text-align: center;
        box-sizing: border-box;
      }
      img {
        width: 96px;
        height: 96px;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      p {
        margin: 0;
        color: #8a96b8;
        max-width: 28ch;
        line-height: 1.5;
      }
      .button {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        min-height: 44px;
        padding: 0 1.5rem;
        border-radius: 999px;
        font: inherit;
        font-weight: 600;
        color: #070a12;
        background: linear-gradient(135deg, #22e5ff, #8b5cff 50%, #ff3dcb);
      }
      .button:focus-visible {
        outline: 2px solid #22e5ff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        Questrix needs a connection to record progress. Reconnect to keep your
        streak going.
      </p>
      <a class="button" href="">Try again</a>
    </main>
  </body>
</html>
